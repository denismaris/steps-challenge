<!doctype html><meta charset="utf-8"><title>Test sunet</title>
<style>body{font:20px system-ui;padding:30px;background:#f6f0e2}button{font-size:22px;padding:14px 22px;margin:8px}#log{white-space:pre;font:15px monospace;margin-top:20px}</style>
<h2>Test sunet</h2>
<button id="a">1. Bip (Web Audio)</button>
<button id="b">2. Bip (fișier audio)</button>
<div id="log"></div>
<script>
const log = (m) => (document.getElementById('log').textContent += m + '\n')
let ctx
document.getElementById('a').onclick = async () => {
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)()
    log('stare înainte: ' + ctx.state)
    await ctx.resume()
    log('stare după: ' + ctx.state + ', sampleRate ' + ctx.sampleRate)
    const o = ctx.createOscillator(), g = ctx.createGain()
    g.gain.value = 0.3; o.frequency.value = 660
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.6)
    log('bip pornit la ' + ctx.currentTime.toFixed(2))
    setTimeout(() => log('timp după 1s: ' + ctx.currentTime.toFixed(2)), 1000)
  } catch (e) { log('EROARE: ' + e) }
}
document.getElementById('b').onclick = () => {
  const sr = 22050, n = sr * 0.6, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf)
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)))
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVEfmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true)
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true)
  for (let i = 0; i < n; i++) v.setInt16(44 + i*2, Math.sin(i/sr*2*Math.PI*440)*9000, true)
  const a = new Audio(URL.createObjectURL(new Blob([buf], {type:'audio/wav'})))
  a.play().then(() => log('fișier: se aude?')).catch(e => log('fișier EROARE: ' + e))
}
log('userAgent: ' + navigator.userAgent)
</script>
